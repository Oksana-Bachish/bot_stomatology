services:
  bot:
    build: .
    container_name: bot
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - db_bot

  db_bot:
    image: postgres:17-bookworm
    container_name: db_bot
    volumes:
      - bot_data:/var/lib/postgresql/data/
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

volumes:
  bot_data:

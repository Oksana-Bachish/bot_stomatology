services:
  bot:
    build: .
    container_name: bot
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:8000'
    env_file:
      - ./.env
    depends_on:
      - db_bot

  db_bot:
    image: postgres:17-bookworm
    container_name: db_bot
    volumes:
      - data:/var/lib/postgresql/data/
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bot
      - POSTGRES_PASSWORD=bot330
      - POSTGRES_DB=stoma_bot

volumes:
  data:

